<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
<title id="title">Sathiya Narayanan L | Computer Science at SRMIST</title>
<desc id="description">An oversized typographic introduction on midnight blue, beside a mint and blue animated wireframe sphere.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080e1b"/><stop offset="1" stop-color="#101f34"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#88f5d4"/><stop offset=".5" stop-color="#6bd4f3"/><stop offset="1" stop-color="#8299ff"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#286d89" stop-opacity=".32"/><stop offset="1" stop-color="#286d89" stop-opacity="0"/></radialGradient>
  <clipPath id="frame"><rect x="1" y="1" width="1198" height="418" rx="22"/></clipPath>
</defs>
<style>
  .sphere { transform-origin: 971px 205px; animation: rotate 4.8s ease-out 1; }
  .spark { stroke-dasharray: 90 1080; animation: trace 4.8s ease-in-out 1; }
  @keyframes rotate { from { transform: rotate(-24deg); } to { transform: rotate(0deg); } }
  @keyframes trace { from { stroke-dashoffset: 1170; } to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { .sphere, .spark { animation: none; } }
</style>
<g clip-path="url(#frame)">
