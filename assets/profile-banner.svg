  <text x="51" y="178" fill="#f3f7fc" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700" letter-spacing="-3">Sathiya</text>
  <text x="51" y="259" fill="url(#accent)" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700" letter-spacing="-3">Narayanan L.</text>
  <text x="56" y="307" fill="#b4c4d8" font-family="Arial, Helvetica, sans-serif" font-size="22">Software engineering · AI/ML · Problem solving</text>
  <path d="M56 346H690" stroke="#26364b"/>
  <text x="56" y="382" fill="#8da4bf" font-family="Arial, Helvetica, sans-serif" font-size="16">B.Tech CSE · SRMIST</text>
  <text x="690" y="382" text-anchor="end" fill="#8da4bf" font-family="Arial, Helvetica, sans-serif" font-size="16">Chennai, India</text>
